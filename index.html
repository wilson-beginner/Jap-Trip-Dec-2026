<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>九州跨年自由行｜六天五夜</title><style>
:root{color-scheme:light dark;--bg:#f5f7fa;--card:#fff;--ink:#182b39;--muted:#526575;--line:#dbe3e9;--accent:#176b68} @media(prefers-color-scheme:dark){:root{--bg:#101820;--card:#192630;--ink:#edf4f7;--muted:#b4c4cf;--line:#344550;--accent:#82d9ca}}html[data-theme=dark]{color-scheme:dark;--bg:#101820;--card:#192630;--ink:#edf4f7;--muted:#b4c4cf;--line:#344550;--accent:#82d9ca}html[data-theme=light]{color-scheme:light;--bg:#f5f7fa;--card:#fff;--ink:#182b39;--muted:#526575;--line:#dbe3e9;--accent:#176b68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}main,header>div{max-width:1000px;margin:auto;padding:18px}header{background:#164b52;color:white}h1{font-size:clamp(27px,5vw,44px);line-height:1.25}h2{font-size:25px;line-height:1.4;color:var(--accent)}h3{font-size:19px}section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,3vw,28px);margin:18px 0;scroll-margin-top:75px}nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow:auto;gap:8px;padding:10px;white-space:nowrap}nav a,button{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);font:inherit;text-decoration:none;cursor:pointer}a{color:var(--accent)}.table{overflow-x:auto;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:430px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--bg)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:12px;padding:14px}.tile h3{margin:0 0 6px}.muted,small{color:var(--muted)}.price{font-size:32px;font-weight:750;color:var(--accent)}.flight{display:flex;justify-content:space-between;align-items:center;gap:10px}.flight b{font-size:24px}.bar{display:flex;height:20px;border-radius:10px;overflow:hidden;background:var(--line)}.bar span{transition:width .2s}.field{display:grid;grid-template-columns:1fr 105px;gap:8px;align-items:center;margin:12px 0}input[type=number]{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}input[type=range]{width:100%;accent-color:var(--accent)}input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0}.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.task:has(input:checked) span{text-decoration:line-through;opacity:.6}progress{width:100%;accent-color:var(--accent)}svg{width:100%;height:auto;background:var(--bg);border-radius:12px}svg text{fill:var(--ink);font-size:12px}svg a:hover text{text-decoration:underline}.note{border-left:4px solid var(--accent);padding:8px 12px;background:var(--bg)}@media print{nav,button,input[type=range]{display:none}section{break-inside:avoid}body{background:white;color:black}} </style></head><body><header><div><button id="theme" style="float:right">切換主題</button><h1>九州跨年自由行｜六天五夜</h1><p>2026/12/27（日）～2027/01/01（五）</p><p>自由行・溫泉旅館・地方城市探索・冬季限定活動・購物・美食・日本傳統跨年文化。前三天有主要目的地及交通安排，後三天除了柳川之外，以福岡市區自由探索為主，不再前往近郊。</p></div></header><nav id="nav"></nav><main id="main"></main><script>
const $=s=>document.querySelector(s);const main=$('#main');const table=(heads,rows)=>`<div class="table"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;const tiles=rows=>`<div class="grid">${rows.map(r=>`<article class="tile"><h3>${r[0]}</h3><div>${r[1]}</div>${r[2]?`<small>${r[2]}</small>`:''}</article>`).join('')}</div>`;const sec=(id,title,html)=>{main.insertAdjacentHTML('beforeend',`<section id="${id}"><h2>${title}</h2>${html}</section>`);$('#nav').insertAdjacentHTML('beforeend',`<a href="#${id}">${title.split('｜')[0]}</a>`)};const schedule=r=>table(['時段','行程'],r);const bus='<a href="https://www.nishitetsu.jp/bus/highwaybus/rosen/yufuin/">西鐵高速巴士官方時刻表及預約</a>';
sec('flight','01｜機票與住宿',`<div class="price">NT$11,160／每人</div><b>來回各20公斤托運行李</b><hr><small>去程 12/27 台灣虎航</small><div class="flight"><div><b>06:45</b><br>桃園 TPE</div>✈ 2小時15分<div><b>10:00</b><br>福岡 FUK</div></div><hr><small>回程 01/01 AirAsia</small><div class="flight"><div><b>16:20</b><br>福岡 FUK</div>✈ 2小時50分<div><b>18:10</b><br>桃園 TPE</div></div><p>以上均為當地時間，依照提供的航班與行李資訊整理。</p>`+tiles([['第一晚｜湯布院溫泉旅館','12/27入住、12/28退房。推薦一泊二食，享受日式晚餐、早餐及晨間泡湯。'],['後四晚｜福岡市區飯店','12/28入住、01/01退房。優先推薦博多站附近，方便JR、地鐵及機場交通，不必換飯店。']]));
sec('overview','02｜六天五夜總覽',table(['日期','上午','下午','晚上','住宿'],[['12/27 日','抵達福岡','湯布院','溫泉、日式晚餐','湯布院'],['12/28 一','悠閒享受旅館、返回福岡','久留米、鳥栖 Outlet','購物','福岡'],['12/29 二','小倉','門司港','港口夜景','福岡'],['12/30 三','柳川遊船','鰻魚飯、福岡自由行','市區探索','福岡'],['12/31 四','福岡自由行','福岡自由行','傳統跨年','福岡'],['01/01 五','新年自由探索','搭機返台','—','—']])+ '<p>12/28、12/29使用連續兩天 JR KYUSHU MOBILE PASS。皿倉山已移除。</p>');
sec('d1','03｜Day 1・12/27 湯布院', '<b>自然、日式溫泉、小鎮探索</b>'+schedule([['早上','06:45桃園出發，10:00抵達福岡'],['中午','機場高速巴士直達湯布院'],['下午','湯之坪街道、金鱗湖、特色商店、甜點'],['傍晚','溫泉旅館 Check-in'],['晚上','日式晚餐、泡湯、休息']])+ '<h3>福岡機場國際航廈 → 湯布院（ゆふいん号）</h3>'+table(['出發','抵達','建議'],[['11:38','13:17','入境順利'],['12:08','13:47','首選預約'],['12:38','14:17','備案一'],['13:08','14:59','備案二'],['14:08','15:47','備案三'],['15:08','16:59','嚴重延誤備案']])+`<p>參考時刻，12/27實際班次及空位未確認。指定席預約制，單程¥3,250。${bus}</p>`+tiles([['湯之坪街道','主要觀光街道，甜點、伴手禮、工藝品、咖啡廳。'],['金鱗湖','冬季清晨有機會欣賞湖面霧氣，第一天來不及可隔天去。'],['Yufuin Floral Village','歐式童話小村落，拍照及特色小店。']])+ '<p>不少商店17:00左右關門，優先逛街。一泊二食須確認晚餐最晚報到時間，航班延誤主動聯絡旅館。</p>');
sec('d2','04｜Day 2・12/28 久留米、鳥栖', '<b>悠閒溫泉早晨、地方美食、購物</b>'+schedule([['早上','晨間泡湯、旅館早餐'],['上午','金鱗湖散步、補逛商店、退房'],['上午至中午','高速巴士返回博多'],['下午','飯店寄放行李、啟用JR Pass、前往久留米'],['下午至傍晚','久留米探索、豚骨拉麵'],['傍晚至晚上','鳥栖 Outlet 購物'],['晚上','返回福岡飯店']])+ '<h3>湯布院 → 博多</h3>'+table(['出發','抵達','建議'],[['09:00','10:55','提早出發'],['10:00','12:07','較早選擇'],['10:30','12:25','推薦'],['11:00','12:55','悠閒版'],['12:00','14:07','延誤備案']])+`<p>常態參考班次，12/28未逐班核實，以${bus}為準。14:00後抵達博多可縮短久留米或直接去Outlet，不必打亂隔天。</p>`+tiles([['久留米豚骨拉麵','豚骨拉麵發源地，部分店家比博多拉麵湯頭濃厚。'],['水天宮','筑後川旁神社，散步及地方文化。'],['高良大社','山上俯瞰筑後平原，交通較不便，時間充裕才考慮。'],['鳥栖 Premium Outlets','美式露天購物村，國際服飾、運動、日本品牌，常態至20:00。']])+ '<p>博多→JR久留米→JR鳥栖→巴士至Outlet→博多。JR不必鎖定班次；務必查Outlet末班接駁及年末營業時間。</p>');
sec('d3','05｜Day 3・12/29 北九州','<b>日本古城、港口城市、海峽、冬季夜景</b>'+schedule([['早上','博多搭JR前往小倉'],['上午','小倉城、旦過市場、商店街'],['中午','小倉午餐'],['下午','JR前往門司港、歷史街區'],['傍晚','海港夕陽、燒咖哩'],['晚上','門司港展望室、冬季燈飾，搭JR返回博多']])+tiles([['小倉城','代表性古城，周邊公園與紫川散步。'],['旦過市場、魚町銀天街','傳統市場、商店街、地方小吃。'],['門司港懷舊區','明治、大正歷史建築、港口、咖啡廳與小店。'],['關門海底人行隧道（備選）','徒步從九州到本州，可搭聯絡船返回，額外約2小時。'],['九州鐵道紀念館（備選）','歷史火車、駕駛模擬器、鐵道文化。'],['門司港懷舊展望室','103公尺高空俯瞰港口、關門海峽、本州夜景，年末開放時間待確認。'],['門司港浪漫燈彩','2026/11/14～2027/05/23；12月18:00～24:00，約30萬顆燈泡，免費。']])+table(['區間','列車','概略時間'],[['博多→小倉','Sonic特急自由席','40～50分鐘'],['小倉→門司港','普通或快速','15～20分鐘'],['門司港→小倉','普通或快速','15～20分鐘'],['小倉→博多','Sonic等適用特急自由席','40～50分鐘']])+ '<p>無必搭早班車，晚餐後悠閒返回，不要以末班JR為首選。</p>');
sec('d4','06｜Day 4・12/30 柳川＋福岡','<b>水鄉文化、冬季限定遊船、地方美食</b>'+schedule([['早上','西鐵福岡（天神）站'],['上午','西鐵電車前往柳川、遊船約60～70分鐘'],['中午','鰻魚蒸籠飯、水鄉散步'],['下午','返回福岡市區自由探索']])+ '<p>西鐵福岡（天神）→西鐵柳川，特急約50分鐘，09:00～10:00出發，不鎖定班次。可比較交通＋遊船套票。</p>'+tiles([['暖桌船（こたつ舟）','傳統遊船設暖桌，聽船夫介紹水鄉文化。通常12月至隔年2月，本年度確切日期待公告。'],['鰻魚蒸籠飯（うなぎのせいろ蒸し）','蒲燒鰻魚與醬汁炊飯放入蒸籠加熱，與鰻魚丼不同。可考慮本吉屋，若松屋通常星期三公休，年末營業待確認。']])+ '<p>下午至晚上優先逛想去的商店、百貨、咖啡廳及餐廳，隔天除夕可能提早打烊。</p>');
sec('d5','07｜Day 5・12/31 福岡＋跨年','<p>白天不設定必去景點，依天氣、體力及前一天進度選擇。</p>'+schedule([['上午','公園、在地商店街、咖啡廳'],['下午','海濱、觀景台、冬季活動或購物'],['傍晚','夕陽、冬季夜景'],['晚上','年越蕎麥麵、飯店休息'],['深夜','神社跨年、初詣']])+ '<p>中間可回飯店休息，不必從早玩到晚。</p>');
sec('d6','08｜Day 6・01/01 新年＋返台','<p>睡到自然醒、參拜、初賣或博多散步，不排固定景點。</p>'+schedule([['早上','早餐、新年自由探索'],['中午','退房、午餐、取行李'],['12:30～13:00','建議出發前往機場'],['13:30前後','抵達福岡機場國際航廈'],['16:20','AirAsia返台'],['18:10','抵達桃園']])+table(['方式','特點'],[['地鐵＋航廈接駁','博多→機場站約5分鐘，轉免費國內線至國際線接駁'],['市區直達巴士','不用轉乘，留意元旦班次及道路'],['計程車','20公斤行李較方便，多人可分攤']])+ '<p>國際航班需托運，不要壓縮報到時間。</p>');
const areas=[['天神站／天神南站','核心商業區，百貨、地下街、服飾、藥妝、美食。','空港線／七隈線｜2～4小時'],['赤坂站','大名商圈、古著、潮流、獨立品牌、咖啡廳，可步行至天神。','空港線｜1.5～3小時'],['博多站','百貨、伴手禮、美食街、廣場冬季燈飾。','空港線／七隈線｜1～3小時'],['西新站／藤崎站','商店街、傳統市場、學生生活圈、平價美食，可沿街步行兩站。','空港線｜1.5～2小時'],['六本松站','蔦屋書店、文青小店、麵包店、咖啡廳，觀光客較少。','七隈線｜1～2小時'],['藥院站／藥院大通站','質感住宅區、獨立咖啡廳、甜點、選物店、小餐廳。','七隈線｜1～2小時'],['大濠公園站','大濠公園、舞鶴公園、福岡城跡，湖畔散步。','空港線｜2～3小時'],['唐人町站／西新站','百道海濱、福岡巨蛋、福岡塔、夕陽夜景。塔距地鐵20多分鐘步程，也可搭公車。','空港線｜2～4小時'],['中洲川端站','川端通商店街、中洲屋台、那珂川、福博相遇橋。','空港線／箱崎線｜2～3小時'],['櫛田神社前站','博多運河城、櫛田神社、博多舊市街。','七隈線｜2～3小時'],['祇園站','東長寺、福岡大佛、寺院群、歷史街道。','空港線｜1～2小時'],['箱崎宮前站','筥崎宮，日本三大八幡宮之一，新年初詣。','箱崎線｜1～2小時']];
const maplink=n=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(n+' Japan')}`;const maptiles=rows=>tiles(rows.map(r=>[r[0],r[1]+` <a href="${maplink(r[0].split('／')[0])}" target="_blank" rel="noopener">地圖</a>`,r[2]]));
sec('city','09｜福岡市區自由探索指南','<p>12/30下午、12/31全天、01/01上午自由選擇，不限制日期。</p><h3>A. 購物、潮流與日本都市生活</h3>'+maptiles(areas.slice(0,3))+'<h3>B. 在地生活與非典型觀光街區</h3>'+maptiles(areas.slice(3,6))+'<h3>C. 自然、海濱及城市景觀</h3>'+maptiles(areas.slice(6,8))+'<h3>D. 歷史文化、美食及夜生活</h3>'+maptiles(areas.slice(8))+'<p><a href="https://subway.city.fukuoka.lg.jp/">福岡地鐵官方路線圖</a></p>');
sec('events','10｜冬季限定活動與日本新年習俗','<h3>冬季限定活動</h3>'+tiles([['百道海濱 ICE SKATING PARK','福岡塔前戶外溜冰場、冬季美食攤位。溜冰場11/20～02/23，ICE WORLD市集11/20～01/06；12/30、12/31溜冰場特別營業至22:00。福岡塔與溜冰場相互購票優惠。 <a href="https://fuk-sc.com/">活動官方網站</a>'],['博多站・光之街','11/03～01/11，17:00～23:00，免費大型廣場燈飾。'],['博多運河城冬季燈飾','11/13～02/28，部分特別演出12/25結束，燈飾免費。'],['小倉冬季燈飾','紫川河畔、橋梁及市區燈飾，12/29回程順道欣賞，預計至01/11，免費。']])+ '<p>多數大型聖誕市集及福岡塔聖誕限定塔身燈光12/25結束，百道ICE WORLD仍持續。</p><h3>日本跨年及新年文化</h3>'+tiles([['年越蕎麥麵（年越しそば）','12/31食用，象徵長壽及告別不順。'],['除夜之鐘（除夜の鐘）','佛寺敲108次鐘聲，象徵消除煩惱，留意寺院是否開放參與。'],['初詣（はつもうで）','新年第一次參拜，12/31深夜或01/01早上祈求平安健康好運。'],['御神籤、御守、繪馬','抽籤、購買御守、寫下新年願望。'],['初賣與福袋（初売り・福袋）','新年促銷，部分百貨1/2甚至1/3才開始，元旦須看公告。'],['獅子舞（ししまい）','驅邪祈福，部分商場或神社舉辦，個別場次未確認。'],['初日出（初日の出）','新年第一道曙光，視天氣及體力。']])+table(['神社','特色','交通'],[['櫛田神社','博多代表、熱鬧、傳統','櫛田神社前站'],['住吉神社','歷史悠久、住宿博多方便','博多站步行'],['筥崎宮','大型神社、新年氣氛','箱崎宮前站']])+ '<p>首選櫛田神社，深夜返回飯店方便。特別開放時間及地鐵延長營運須確認，不假設通宵列車。</p>');
sec('budget','11｜交通票券與基本費用','<h3>JR KYUSHU MOBILE PASS 福岡廣域版・連續兩日券 ¥3,500</h3><p>12/28～12/29。適用普通、快速及範圍內特急自由席；博多、久留米、鳥栖、小倉、門司港。不含新幹線、特急指定席、地鐵、西鐵、巴士。</p><p><a href="https://www.jrkyushu.co.jp/chinese/railpass/mobilepass.html">JR九州官方購票資訊</a></p>'+table(['票券','建議'],[['湯布院高速巴士','提前預約、WEB早割'],['西鐵柳川套票','12/30比較交通＋遊船'],['福岡地鐵一日券','搭乘次數多的當天再買'],['Suica／ICOCA等IC卡','零星地鐵、電車、巴士']])+ '<h3>每人預算試算</h3><div class="price" id="total"></div><div class="bar" id="bar" role="img" aria-label="預算組成"></div><div id="legend"></div><div id="fields"></div><div id="fixed"></div><p class="muted">住宿、餐飲及其他費用為暫定估算，假設住宿費已按人分攤，不含個人購物及旅遊保險；匯率為試算假設，非即時匯率。</p><button id="resetBudget">重設預算</button>');
const fields=[['rate','日圓換算台幣匯率',.21,.1,.4,.001],['hotel1','湯布院住宿一晚',4500,0,20000,100],['hotel4','福岡住宿四晚',6000,0,30000,100],['food','六天餐飲',4500,0,20000,100],['other','柳川、地鐵、門票及其他',2500,0,15000,100]];const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};let vals=load('kyushu-budget',Object.fromEntries(fields.map(f=>[f[0],f[2]])));$('#fields').innerHTML=fields.map(([id,n,d,min,max,step])=>`<div class="field"><label for="${id}">${n}</label><input id="${id}" type="number" min="0" step="${step}" value="${vals[id]}"></div><input aria-label="${n}滑桿" id="${id}Range" type="range" min="${min}" max="${max}" step="${step}" value="${vals[id]}">`).join('');const money=n=>'NT$'+Math.round(n).toLocaleString('en-US');function calc(){let r=vals.rate||0,b=6500*r,j=3500*r,l=560*r;let groups=[['機票',11160,'#557ca8'],['交通',b+j+l,'#65a6ac'],['住宿',vals.hotel1+vals.hotel4,'#d5a65c'],['餐飲',vals.food,'#7da885'],['其他',vals.other,'#a89abf']];let total=groups.reduce((a,x)=>a+x[1],0);$('#total').textContent=money(total);$('#bar').innerHTML=groups.map(x=>`<span style="background:${x[2]};width:${x[1]/total*100}%"></span>`).join('');$('#legend').innerHTML=groups.map(x=>`<small style="display:inline-block;margin-right:12px"><span style="color:${x[2]}">●</span> ${x[0]} ${money(x[1])}</small>`).join('');$('#fixed').innerHTML=table(['固定支出','金額'],[['來回機票＋20公斤行李',money(11160)],['湯布院來回巴士',money(b)],['JR Mobile Pass',money(j)],['Outlet接駁巴士',money(l)],['預估總支出',money(total)]]);save('kyushu-budget',vals)}fields.forEach(([id])=>{for(const suffix of ['', 'Range'])$('#'+id+suffix).addEventListener('input',e=>{vals[id]=Math.max(0,Number(e.target.value)||0);$('#'+id+(suffix?'':'Range')).value=vals[id];calc()})});$('#resetBudget').onclick=()=>{fields.forEach(([id,n,d])=>{vals[id]=d;$('#'+id).value=d;$('#'+id+'Range').value=d});calc()};calc();
const tasks=[['預訂12/27湯布院溫泉旅館','一泊二食、晚餐最晚入住'],['預訂12/28～01/01福岡飯店','博多站附近連住四晚'],['預訂12/27高速巴士','首選12:08機場國際線'],['預訂12/28高速巴士','首選10:30或11:00'],['購買JR Mobile Pass','12/28、12/29'],['確認柳川遊船及鰻魚飯','12/30年末營業、暖桌船及套票'],['確認鳥栖 Outlet','年末營業、接駁末班'],['確認北九州景點','12/29展望室、鐵道紀念館'],['確認福岡跨年活動','神社、除夜之鐘、深夜交通'],['確認元旦營業資訊','初賣、福袋、餐廳、機場交通'],['準備旅遊保險及Visit Japan Web','出發前完成']];sec('check','12｜出發前準備事項','<p id="progressText"></p><progress id="progress" max="11"></progress><div id="tasks"></div><button id="resetTasks">重設清單</button>');let done=load('kyushu-tasks',[]);function renderTasks(){$('#tasks').innerHTML=tasks.map((t,i)=>`<label class="task"><input type="checkbox" data-i="${i}" ${done.includes(i)?'checked':''}><span><b>${t[0]}</b><br><small>${t[1]}</small></span></label>`).join('');$('#progress').value=done.length;$('#progressText').textContent=`${done.length}/${tasks.length} 完成`;save('kyushu-tasks',done)}$('#tasks').onchange=e=>{let i=Number(e.target.dataset.i);done=e.target.checked?[...new Set([...done,i])]:done.filter(x=>x!==i);renderTasks()};$('#resetTasks').onclick=()=>{done=[];renderTasks()};renderTasks();
const places=[['福岡機場',220,140],['湯布院',335,235],['博多',190,125],['久留米',165,220],['鳥栖 Outlet',190,190],['小倉',300,55],['門司港',345,28],['柳川',100,265]];const routes=[[0,1],[1,2,3,4,2],[2,5,6,2],[2,7,2],[2,0]];sec('map','13｜整趟旅行地理分布','<p>點擊地點開啟外部地圖。下圖為離線路線示意，非實際比例或導航。</p><div id="routeButtons"></div><svg viewBox="0 0 400 310" id="mapSvg" aria-label="九州行程示意圖"></svg><div id="mapLinks"></div>');let route=-1;function draw(){let colors=['#d58a46','#519e87','#527ec1','#a36ab2','#999'];$('#mapSvg').innerHTML=routes.map((r,i)=>`<polyline points="${r.map(j=>places[j].slice(1).join(',')).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="${route===i?5:2.5}" opacity="${route===-1||route===i?1:.12}"/>`).join('')+places.map(([n,x,y])=>`<a href="${maplink(n)}" target="_blank"><circle cx="${x}" cy="${y}" r="6" fill="#dd9860" stroke="white"/><text x="${x}" y="${y-10}" text-anchor="middle">${n}</text></a>`).join('');$('#mapLinks').innerHTML=places.map(p=>`<a style="display:inline-block;margin:6px" href="${maplink(p[0])}">${p[0]}</a>`).join('')}$('#routeButtons').innerHTML=['全部','12/27','12/28','12/29','12/30','12/31～01/01'].map((n,i)=>`<button data-route="${i-1}">${n}</button>`).join('');$('#routeButtons').onclick=e=>{if(e.target.dataset.route!==undefined){route=Number(e.target.dataset.route);draw()}};draw();
sec('summary','最終總結',tiles([['湯布院','溫泉度假'],['久留米・鳥栖','美食購物'],['北九州','歷史港口夜景'],['柳川','冬季水鄉體驗'],['福岡','地鐵城市探索'],['跨年','日本傳統文化']])+ '<p>保留自然景點、地方城市、購物、美食與季節限定活動，避免每天長途移動。真正需要鎖定時間的是來回航班、湯布院來回高速巴士、旅館入住與晚餐、返回機場。其他行程視情況彈性調整。</p><p class="note">尚未完成實際訂票及住宿預訂，部分車次為常態參考，年末年始特殊營業時間需確認。本頁由原行程轉製，未重新查證。原聊天的即時照片與地圖服務無法封裝為離線原生HTML，改為文字景點卡、地圖連結及路線示意。</p>');let theme=load('kyushu-theme','auto');function applyTheme(){if(theme==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=theme;$('#theme').textContent='主題：'+({auto:'系統',light:'淺色',dark:'深色'}[theme])}$('#theme').onclick=()=>{theme=({auto:'light',light:'dark',dark:'auto'})[theme];save('kyushu-theme',theme);applyTheme()};applyTheme();</script></body></html>
